<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Color Changer Pro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 300px;
        }

        input {
            padding: 8px;
            width: 80%;
            margin-bottom: 10px;
        }

        button {
            padding: 8px 15px;
            border: none;
            background: #667eea;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #5a67d8;
        }

        p {
            margin-top: 20px;
            font-size: 18px;
            transition: all 0.5s ease;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>Color Changer</h2>
        <input type="text" id="color" placeholder="Enter color name">
        <br>
        <button id="check">Apply</button>
        <p id="result">Watch my color change!</p>
    </div>

    <script>
        let button = document.getElementById("check");
        let paragraph = document.getElementById("result");
        let input = document.getElementById("color");

        button.addEventListener("click", function () {
            let colorValue = input.value.trim();

            // Create temporary element to validate color
            let testDiv = document.createElement("div");
            testDiv.style.color = colorValue;

            if (testDiv.style.color !== "") {
                paragraph.style.color = colorValue;
                paragraph.textContent = "Color changed to " + colorValue + " ✅";
            } else {
                paragraph.textContent = "Invalid color name ❌";
                paragraph.style.color = "red";
            }
        });
    </script>

</body>

</html>
