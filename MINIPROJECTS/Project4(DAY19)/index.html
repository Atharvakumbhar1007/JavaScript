<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="generator">
        <h1>Password Generator</h1>
        <div class="password-display" id="passwordDisplay">
            <span id="passwordText">Click Generate</span>
            <button class="copy-btn" id="copyBtn"></button>
        </div>

        <div class="options">
            <label><input type="checkbox" id="uppercase">Uppercase</label>
            <label><input type="checkbox" id="lowercase">Lowercase</label>
            <laabel><input type="checkbox" id="numbers">Numbers</laabel>
            <label>
                <inout type="checkbox" id="symbols">Symbols</inout>
            </label>
        </div>

        <div class="slider-container">
            <label for="length">Length: <span id="lengthValue">8</span></label>
            <imput type="range" id="length" min="1" max="20" value="10"> </imput>
        </div>

        <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
        </div>

        <button class="generate-btn" id="generateBtn">Generate Password</button>
    </div>

    <script src="script.js"></script>

</body>

</html>
